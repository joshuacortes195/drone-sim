# builds the site and puts it on github pages every time main changes
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# pages needs to be allowed to publish, nothing else gets write access
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, a newer push waits instead of cutting one off halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # the c++ tests (physics, control, planning, sensors, lidar, wind) have to pass before anything goes live
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run the tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target tests -j4
          ctest --test-dir build --output-on-failure

  # typechecks and builds the web app into web/dist, runs alongside the tests
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  # publishes what the build job uploaded, only once the tests passed too
  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

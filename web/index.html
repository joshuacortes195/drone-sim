<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Sim</title>
    <style>
      /* full screen page for the 3d view */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8e3; }
      canvas { display: block; }
      /* styling for the readout and camera button in the top left corner */
      .bar {
        position: fixed; top: 8px; left: 8px; right: 8px;
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        font: 12px/1.4 ui-monospace, Menlo, monospace; color: #1d2733;
      }
      .bar span { padding: 4px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.75); }
      .bar button { font: inherit; color: #1d2733; background: #fff; border: 1px solid #9aa7b6; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="bar">
      <button id="cam">top down view (c)</button>
      <span id="hud">loading</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
